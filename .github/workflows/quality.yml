name: R package quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "oldrel-1"}
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  scale-smoke:
    name: Scale and bundle budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Enforce smoke budgets
        run: Rscript tools/benchmarks/run_scale_benchmarks.R evidence/scale smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referent-scale-smoke
          path: evidence/scale

  scale-release:
    name: Release-scale budgets
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Enforce release budgets
        run: Rscript tools/benchmarks/run_scale_benchmarks.R evidence/scale release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referent-scale-release
          path: evidence/scale
