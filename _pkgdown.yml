url: https://bbuchsbaum.github.io/referent

starlightdown:
  theme: default
  quickstart: |
    library(referent)
    reference <- ref_simulate(300, seed = 1)
    fit <- ref_fit(
      ref_spec(ref_gaussian(), ~ s(age, k = 8) + sex),
      data = reference,
      outcomes = "y"
    )
    scores <- predict(fit, newdata = ref_simulate(100, seed = 2))

