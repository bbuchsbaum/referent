name: Real-cohort validation

on:
  schedule:
    - cron: "41 7 1 * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nhanes-external-cohort:
    name: NHANES 2015-2016 to 2017-2018
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::foreign
            local::.
          needs: check
      - name: Run independent-cohort validation
        run: >-
          Rscript tools/validation/run_nhanes_external_validation.R
          evidence/nhanes-external
          /tmp/nhanes-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhanes-external-validation-evidence
          path: evidence/nhanes-external
